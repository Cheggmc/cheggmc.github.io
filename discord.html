<!doctype html>

<style>
  .redirect-wrap{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .redirect-card{
    max-width:440px; width:100%;
  }
  .discord-mark{
    width:64px;height:64px; border-radius:16px; margin:0 auto 24px;
    background:#2b2f4a; border:1px solid #3b4070;
    display:flex; align-items:center; justify-content:center;
  }
  .spinner{
    width:22px;height:22px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--amber);
    animation:spin 0.8s linear infinite; margin:0 auto 18px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .manual-link{
    display:inline-block; margin-top:8px; font-size:13px; color:var(--cream-dim); text-decoration:underline;
  }
</style>
