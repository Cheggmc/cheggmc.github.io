<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work in Progress</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #222222;
    font-family: 'Impact', 'Arial Black', sans-serif;
    color: #ffffff;
    overflow: hidden;
    padding: 20px;
    box-sizing: border-box;
  }
  .container {
    text-align: center;
    position: relative;
    width: 100%;
    max-width: 600px;
    padding: 60px 20px;
  }
  .tape {
    position: absolute;
    width: 300vw;
    height: 50px;
    background: repeating-linear-gradient(
      -45deg,
      #ffcc00,
      #ffcc00 30px,
      #000000 30px,
      #000000 60px
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 20px;
    color: #000000;
    letter-spacing: 2px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.8);
    z-index: 10;
    white-space: nowrap;
  }
  .tape-1 {
    top: 0;
    left: -100vw;
    transform: rotate(-8deg);
  }
  .tape-2 {
    bottom: 0;
    left: -100vw;
    transform: rotate(8deg);
  }
  h1 {
    font-size: 2.5rem;
    margin: 0 0 15px 0;
    color: #ffcc00;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  p {
    color: #cccccc;
    font-size: 1.1rem;
    margin: 0;
    font-family: Arial, sans-serif;
  }

  /* Mobile optimization */
  @media (max-width: 480px) {
    .tape {
      height: 40px;
      font-size: 16px;
    }
    h1 {
      font-size: 1.8rem;
    }
    p {
      font-size: 0.9rem;
    }
    .tape-1 {
      transform: rotate(-12deg);
    }
    .tape-2 {
      transform: rotate(12deg);
    }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Top Tape -->
  <div class="tape tape-1">WORK IN PROGRESS • UNDER CONSTRUCTION • WORK IN PROGRESS • UNDER CONSTRUCTION</div>
  
  <h1>UNDER CONSTRUCTION</h1>
  <p>We are still building this site. Check back soon!</p>
  
  <!-- Bottom Tape -->
  <div class="tape tape-2">CAUTION • DO NOT ENTER • CAUTION • DO NOT ENTER • CAUTION • DO NOT ENTER</div>
</div>

</body>
</html>
